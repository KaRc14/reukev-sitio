# ReuKev — configuración de publicación en Netlify.
# Publicar la carpeta sitio-web. CSP estricta: sin 'unsafe-inline' ni 'unsafe-eval'
# (todo el JS está en archivos propios y los eventos usan addEventListener).

[build]
  publish = "sitio-web"
  # Sitio estático: no hay paso de build en Netlify. El CSS se compila en local con:
  #   npm run build:css

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'self'; font-src 'self'; manifest-src 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
